<script>
        function togglePassword() {
            const input = document.getElementById('password-input');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Simple mouse tracking for a subtle atmospheric effect on the form
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            const y = (e.clientY / window.innerHeight) * 2 - 1;
            const logo = document.querySelector('.lg\\:flex .z-10');
            if (logo) {
                logo.style.transform = `translate(${x * 5}px, ${y * 5}px)`;
                logo.style.transition = 'transform 0.2s ease-out';
            }
        });
    </script>
