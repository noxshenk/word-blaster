<style>
        .liquid-glass {
            background: rgba(26, 26, 26, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            position: relative;
            border-radius: 1rem;
        }
        
        .liquid-glass-strong {
            background: rgba(14, 14, 14, 0.6);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            position: relative;
            border-radius: 2rem;
        }

        .glass-border::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.1) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .letter-node {
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .letter-node.active {
            background: #ffffff;
            color: #000000;
            transform: scale(1.1);
        }

        .word-pill {
            transition: all 0.3s ease;
        }

        .word-pill.found {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        @keyframes pulse-success {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-success {
            animation: pulse-success 0.4s ease-out;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        #connection-svg {
            pointer-events: none;
        }

        .line-glow {
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.5));
        }
    </style>
</head>
<body class="bg-black text-on-surface font-poppins selection:bg-primary selection:text-black overflow-hidden h-screen w-screen">
<!-- Background Video -->
<video autoplay="" class="fixed inset-0 w-full h-full object-cover z-[-1] opacity-60 pointer-events-none" loop="" muted="" playsinline="">
<source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260315_073750_51473149-4350-4920-ae24-c8214286f323.mp4" type="video/mp4">
</video>
<!-- UI Overlay Layer -->
<main class="relative z-10 flex flex-col h-full max-w-[1200px] mx-auto px-margin-mobile md:px-margin-desktop py-8" id="game-container">
<!-- Header -->
<header class="flex flex-col gap-6 w-full animate-in fade-in slide-in-from-top duration-700">
<div class="flex justify-between items-start">

<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="grid grid-cols-3 gap-3 w-full max-w-sm ml-4">
<div class="liquid-glass glass-border p-4 flex flex-col items-center">
<span class="font-label-sm text-label-sm opacity-60">LEVEL</span>
<span class="font-title-md text-title-md font-bold tracking-tight">3</span>
</div>
<div class="liquid-glass glass-border p-4 flex flex-col items-center">
<span class="font-label-sm text-label-sm opacity-60">SCORE</span>
<span class="font-title-md text-title-md font-bold tracking-tight transition-all" id="current-score">115</span>
</div>
<div class="liquid-glass glass-border p-4 flex flex-col items-center">
<span class="font-label-sm text-label-sm opacity-60">BEST</span>
<span class="font-title-md text-title-md font-bold tracking-tight">1370</span>
</div>
</div>
</div>
<!-- Progress Pill -->
<div class="w-full flex flex-col gap-2">
<div class="h-2 w-full liquid-glass glass-border overflow-hidden rounded-full">
<div class="h-full bg-white transition-all duration-500" id="progress-bar" style="width: 20%;"></div>
</div>

<span>PROGRESS</span>
<span id="progress-count">1 / 5 words</span>
</div>
</div>
</header>
<!-- Center: Board Area -->
<section class="flex-grow flex flex-col items-center justify-center py-xl relative">
<!-- Floating Preview -->
<div class="mb-12 h-16 flex items-center justify-center" id="word-preview">
<span class="font-serif-italic text-display-lg italic tracking-widest text-white drop-shadow-lg opacity-0 transition-all duration-200 translate-y-4">
                    S T A R
                </span>
</div>
<!-- Letter Wheel / Board -->
<div class="liquid-glass-strong glass-border w-full max-w-sm aspect-square flex items-center justify-center animate-in zoom-in fade-in duration-1000 overflow-hidden relative" id="board-area">
<!-- SVG Connection Layer -->
<svg class="absolute inset-0 w-full h-full pointer-events-none z-0" id="connection-svg">
<path class="line-glow" d="" fill="none" id="connection-path" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
</svg>
<div class="relative w-64 h-64" id="letter-wheel">

<!-- Right: S -->

<!-- Left: R -->

</div>

<div class="word-pill found liquid-glass glass-border px-6 py-3 rounded-full font-bold tracking-widest text-label-md">STAR</div>
<div class="word-pill liquid-glass glass-border px-6 py-3 rounded-full font-bold tracking-widest text-label-md opacity-40">...</div>
<div class="word-pill liquid-glass glass-border px-6 py-3 rounded-full font-bold tracking-widest text-label-md opacity-40">...</div>
<div class="word-pill liquid-glass glass-border px-6 py-3 rounded-full font-bold tracking-widest text-label-md opacity-40">...</div>
<div class="word-pill liquid-glass glass-border px-6 py-3 rounded-full font-bold tracking-widest text-label-md opacity-40">...</div>

<!-- Actions -->

</button>

<div class="liquid-glass px-4 py-2 font-black tracking-tighter text-label-md">WORD BLASTER</div>
<div class="flex flex-col md:items-end text-[10px] font-label-sm uppercase tracking-[0.2em] space-y-1">
<span>Nox Shenk Creation</span>

<script>
        // State
        const boardArea = document.getElementById('board-area');
        const svgPath = document.getElementById('connection-path');
        const lettersNodes = document.querySelectorAll('.letter-node');
        const previewEl = document.querySelector('#word-preview span');
        const scoreEl = document.getElementById('current-score');
        const clearBtn = document.getElementById('clear-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        
        let currentWord = "";
        let selectedNodes = []; // Array of elements
        let mousePos = { x: 0, y: 0 };
        let isDragging = false;
        let score = 115;

        // Event Listeners
        lettersNodes.forEach(node => {
            node.addEventListener('mousedown', (e) => startSelection(e, node));
            node.addEventListener('mouseenter', () => {
                if (isDragging) selectNode(node);
            });
            node.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startSelection(e.touches[0], node);
            }, { passive: false });
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                updateMousePos(e);
                updateSVGPath();
            }
        });

        document.addEventListener('touchmove', (e) => {
            if (isDragging) {
                updateMousePos(e.touches[0]);
                // For touch, we need to manually check collision since mouseenter won't fire
                const touch = e.touches[0];
                const element = document.elementFromPoint(touch.clientX, touch.clientY);
                if (element && element.classList.contains('letter-node')) {
                    selectNode(element);
                }
                updateSVGPath();
            }
        }, { passive: false });

        document.addEventListener('mouseup', endSelection);
        document.addEventListener('touchend', endSelection);

        function startSelection(e, node) {
            isDragging = true;
            currentWord = "";
            selectedNodes = [];
            selectNode(node);
            updateMousePos(e);
            updateSVGPath();
        }

        function updateMousePos(e) {
            const rect = boardArea.getBoundingClientRect();
            mousePos.x = e.clientX - rect.left;
            mousePos.y = e.clientY - rect.top;
        }

        function selectNode(node) {
            if (!selectedNodes.includes(node)) {
                node.classList.add('active');
                selectedNodes.push(node);
                currentWord += node.getAttribute('data-letter');
                updatePreview();
                updateSVGPath();
                
                if ('vibrate' in navigator) navigator.vibrate(10);
            }
        }

        function updatePreview() {
            previewEl.textContent = currentWord.split('').join(' ');
            previewEl.style.opacity = currentWord.length > 0 ? "1" : "0";
            previewEl.style.transform = currentWord.length > 0 ? "translateY(0)" : "translateY(20px)";
        }

        function getCenter(el) {
            const rect = el.getBoundingClientRect();
            const boardRect = boardArea.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2 - boardRect.left,
                y: rect.top + rect.height / 2 - boardRect.top
            };
        }

        function updateSVGPath() {
            if (selectedNodes.length === 0) {
                svgPath.setAttribute('d', '');
                return;
            }

            let d = "";
            selectedNodes.forEach((node, i) => {
                const center = getCenter(node);
                if (i === 0) {
                    d += `M ${center.x} ${center.y}`;
                } else {
                    d += ` L ${center.x} ${center.y}`;
                }
            });

            if (isDragging) {
                const lastNodeCenter = getCenter(selectedNodes[selectedNodes.length - 1]);
                d += ` L ${mousePos.x} ${mousePos.y}`;
            }

            svgPath.setAttribute('d', d);
        }

        function endSelection() {
            if (!isDragging) return;
            isDragging = false;
            
            if (currentWord.length > 0) {
                checkWord();
            }
            
            // Short delay to see the connection before reset
            setTimeout(() => {
                resetSelection();
            }, 100);
        }

        function checkWord() {
            const validWords = ["STAR", "ARTS", "RATS", "TARS"];
            if (validWords.includes(currentWord)) {
                score += currentWord.length * 10;
                scoreEl.textContent = score;
                scoreEl.classList.add('scale-125', 'text-white');
                
                boardArea.classList.add('animate-success');
                
                setTimeout(() => {
                    scoreEl.classList.remove('scale-125', 'text-white');
                    boardArea.classList.remove('animate-success');
                }, 400);
            }
        }

        function resetSelection() {
            selectedNodes.forEach(n => n.classList.remove('active'));
            selectedNodes = [];
            currentWord = "";
            updatePreview();
            updateSVGPath();
        }

        clearBtn.addEventListener('click', resetSelection);

        shuffleBtn.addEventListener('click', () => {
            const nodes = Array.from(lettersNodes);
            const positions = [
                {top: '0', left: '50%', transform: 'translateX(-50%)'},
                {top: '50%', right: '0', transform: 'translateY(-50%)'},
                {bottom: '0', left: '50%', transform: 'translateX(-50%)'},
                {top: '50%', left: '0', transform: 'translateY(-50%)'}
            ];
            
            for (let i = positions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [positions[i], positions[j]] = [positions[j], positions[i]];
            }

            nodes.forEach((node, idx) => {
                node.style.top = positions[idx].top || 'auto';
                node.style.right = positions[idx].right || 'auto';
                node.style.bottom = positions[idx].bottom || 'auto';
                node.style.left = positions[idx].left || 'auto';
                node.style.transform = positions[idx].transform;
            });
            // Update SVG just in case something is being selected while shuffling
            setTimeout(updateSVGPath, 300);
        });

        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.animate-in');
            elements.forEach((el, i) => {
                el.style.animationDelay = `${i * 100}ms`;
            });
        });
    </script>
