<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Blaster — Log In</title>
  <meta name="description" content="Log in to your Word Blaster player account and join the arena." />
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="register-layout">
    <section class="register-hero">
      <video autoplay loop muted playsinline>
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260315_073750_51473149-4350-4920-ae24-c8214286f323.mp4" type="video/mp4" />
      </video>
      <div class="register-hero-content">
        <div class="register-logo stagger-reveal" style="animation-delay: 0.1s;">
          <div class="register-logo-icon">
            <span class="material-symbols-outlined">bolt</span>
          </div>
          <span>Word Blaster</span>
        </div>
        <div>
          <h1 class="stagger-reveal" style="animation-delay: 0.2s;">Welcome Back, Blaster</h1>
          <p class="stagger-reveal" style="animation-delay: 0.3s; margin-top: 16px;">
            Log in to access your stats, multiplayer lobbies, and compete on the global leaderboard.
          </p>
        </div>
        <div class="register-steps stagger-reveal" style="animation-delay: 0.4s;">
          <div class="register-step">
            <div class="step-number active">1</div>
            <span class="step-label">Authentication</span>
          </div>
          <div class="register-step">
            <div class="step-number inactive">2</div>
            <span class="step-label inactive">Matchmaking</span>
          </div>
          <div class="register-step">
            <div class="step-number inactive">3</div>
            <span class="step-label inactive">Victory</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Right Column (Form) -->
    <section class="register-form-wrap fade-in">
      <div class="register-form-container">
        <!-- Header -->
        <div class="register-header">
          <h2>Player Login</h2>
          <p>Enter your credentials to enter the arena.</p>
        </div>

        <!-- Notification Banner for errors/success -->
        <div id="auth-notification" class="auth-notification" style="display: none;"></div>

        <!-- Login Form -->
        <form class="register-form" id="login-form">
          <div class="form-group">
            <label class="form-label" for="username-input">Username</label>
            <input class="form-input" id="username-input" type="text" placeholder="blaster_pro" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="password-input">Password</label>
            <div class="password-wrap">
              <input class="form-input" id="password-input" type="password" placeholder="••••••••" required />
              <button class="password-toggle" type="button" id="toggle-password">
                <span class="material-symbols-outlined" id="eye-icon">visibility</span>
              </button>
            </div>
          </div>
          <button class="btn-primary" type="submit" id="btn-login">Enter Arena</button>
        </form>

        <!-- Footer -->
        <p class="register-footer">
          New to the arena? <a href="index.html" id="register-link">Create Account</a>
        </p>
      </div>
    </section>
  </main>

  <script>
    let API_URL = 'https://word-blaster.onrender.com/api';
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      if (window.location.port === '3000') {
        API_URL = window.location.origin + '/api';
      } else {
        API_URL = 'http://localhost:3000/api';
      }
    } else if (window.location.hostname.includes('onrender.com')) {
      API_URL = window.location.origin + '/api';
    }

    // Toggle password visibility
    document.getElementById('toggle-password').addEventListener('click', function () {
      const input = document.getElementById('password-input');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    });

    // Mouse tracking parallax on hero
    document.addEventListener('mousemove', function (e) {
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = (e.clientY / window.innerHeight) * 2 - 1;
      const content = document.querySelector('.register-hero-content');
      if (content) {
        content.style.transform = 'translate(' + (x * 5) + 'px, ' + (y * 5) + 'px)';
        content.style.transition = 'transform 0.2s ease-out';
      }
    });

    // Handle Form Submit (API Login call)
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value;
      const btn = document.getElementById('btn-login');
      const notification = document.getElementById('auth-notification');

      if (!username || !password) return;

      btn.disabled = true;
      btn.textContent = 'Connecting...';
      notification.style.display = 'none';

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Save session details
        localStorage.setItem('wb_token', data.token);
        localStorage.setItem('wb_player', data.username);
        localStorage.setItem('wb_best', data.highscore || 0);
        localStorage.setItem('wb_registered', 'true');

        // Success notification
        notification.textContent = 'Access granted! Welcome to the Arena.';
        notification.style.backgroundColor = 'rgba(76, 175, 80, 0.2)';
        notification.style.color = '#4CAF50';
        notification.style.border = '1px solid rgba(76, 175, 80, 0.4)';
        notification.style.display = 'block';

        // Animate out then navigate
        setTimeout(() => {
          document.querySelector('.register-form-wrap').style.opacity = '0';
          document.querySelector('.register-form-wrap').style.transform = 'translateY(-10px)';
          document.querySelector('.register-form-wrap').style.transition = 'all 0.3s ease';
          setTimeout(function () {
            window.location.href = 'menu.html';
          }, 300);
        }, 1000);

      } catch (err) {
        notification.textContent = err.message;
        notification.style.backgroundColor = 'rgba(244, 67, 54, 0.2)';
        notification.style.color = '#F44336';
        notification.style.border = '1px solid rgba(244, 67, 54, 0.4)';
        notification.style.display = 'block';
        
        btn.disabled = false;
        btn.textContent = 'Enter Arena';
      }
    });

    // If already logged in, redirect to menu
    if (localStorage.getItem('wb_registered') === 'true' && localStorage.getItem('wb_token')) {
      window.location.href = 'menu.html';
    }
  </script>
</body>
</html>
