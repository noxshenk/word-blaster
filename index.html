<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Word Blaster</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-item"><span class="hud-label">Level</span><span id="level" class="hud-value">1</span></div>
      <div class="hud-item"><span class="hud-label">Score</span><span id="score" class="hud-value">0</span></div>
      <div class="hud-item"><span class="hud-label">Best</span><span id="best" class="hud-value">0</span></div>
    </header>

    <div id="progress-wrap">
      <div id="progress-bar"></div>
      <div id="progress-text">0 / 0 words</div>
    </div>

    <div id="current-word" aria-live="polite"></div>

    <div id="board-wrap">
      <canvas id="board" width="400" height="400"></canvas>
    </div>

    <div id="words-list"></div>

    <footer id="controls">
      <button id="shuffle" class="btn">↻ Shuffle</button>
      <button id="hint" class="btn">💡 Hint</button>
      <button id="clear" class="btn">✕ Clear</button>
    </footer>

    <div id="overlay" class="hidden">
      <div id="overlay-card">
        <h2 id="overlay-title">Level Complete!</h2>
        <p id="overlay-text"></p>
        <button id="overlay-btn" class="btn primary">Next Level</button>
      </div>
    </div>

    <div id="toast"></div>
  </div>

  <script src="levels.js"></script>
  <script src="dictionary.js"></script>
  <script src="game.js"></script>
</body>
</html>
