<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Blaster — Create Account</title>
  <meta name="description" content="Create your Word Blaster player account and join the leaderboard." />
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="register-layout">
    <section class="register-hero">
      <video autoplay loop muted playsinline>
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260315_073750_51473149-4350-4920-ae24-c8214286f323.mp4" type="video/mp4" />
      </video>
      <div class="register-hero-content">
        <div class="register-logo stagger-reveal" style="animation-delay: 0.1s;">
          <div class="register-logo-icon">
            <span class="material-symbols-outlined">bolt</span>
          </div>
          <span>Word Blaster</span>
        </div>
        <div>
          <h1 class="stagger-reveal" style="animation-delay: 0.2s;">Join Word Blaster</h1>
          <p class="stagger-reveal" style="animation-delay: 0.3s; margin-top: 16px;">
            Follow these 3 quick phases to start your word-blasting adventure.
          </p>
        </div>
        <div class="register-steps stagger-reveal" style="animation-delay: 0.4s;">
          <div class="register-step">
            <div class="step-number active">1</div>
            <span class="step-label">Profile</span>
          </div>
          <div class="register-step">
            <div class="step-number inactive">2</div>
            <span class="step-label inactive">Avatar</span>
          </div>
          <div class="register-step">
            <div class="step-number inactive">3</div>
            <span class="step-label inactive">Arena</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Right Column (Form) -->
    <section class="register-form-wrap fade-in">
      <div class="register-form-container">
        <!-- Header -->
        <div class="register-header">
          <h2>Create Player Account</h2>
          <p>Enter your details to join the leaderboard.</p>
        </div>

        <!-- Social Login -->
        <div class="social-grid">
          <button class="social-btn" id="btn-google">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#fff"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#fff" opacity=".8"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A11.96 11.96 0 001 12c0 1.94.46 3.77 1.18 5.41l3.66-2.84z" fill="#fff" opacity=".6"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#fff" opacity=".4"/>
            </svg>
            <span>Google</span>
          </button>
          <button class="social-btn" id="btn-github">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
              <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
            </svg>
            <span>Github</span>
          </button>
        </div>

        <!-- Divider -->
        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">Or</span>
          <div class="divider-line"></div>
        </div>

        <!-- Notification Banner -->
        <div id="auth-notification" class="auth-notification" style="display: none; margin-bottom: 20px; padding: 12px 16px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: 500;"></div>

        <!-- Registration Form -->
        <form class="register-form" id="register-form">
          <div class="form-group">
            <label class="form-label" for="username-input">Username</label>
            <input class="form-input" id="username-input" type="text" placeholder="Pick a nickname" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="password-input">Password</label>
            <div class="password-wrap">
              <input class="form-input" id="password-input" type="password" placeholder="••••••••" required />
              <button class="password-toggle" type="button" id="toggle-password">
                <span class="material-symbols-outlined" id="eye-icon">visibility</span>
              </button>
            </div>
            <span class="form-hint">Requires at least 8 symbols</span>
          </div>
          <button class="btn-primary" type="submit" id="btn-start">Start Blasting</button>
        </form>

        <!-- Footer -->
        <p class="register-footer">
          Already a player? <a href="login.html" id="login-link">Log in</a>
        </p>
      </div>
    </section>
  </main>

  <script>
    const API_URL = 'https://word-blaster.onrender.com/api';

    // Toggle password visibility
    document.getElementById('toggle-password').addEventListener('click', function () {
      const input = document.getElementById('password-input');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    });

    // Mouse tracking parallax on hero
    document.addEventListener('mousemove', function (e) {
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = (e.clientY / window.innerHeight) * 2 - 1;
      const content = document.querySelector('.register-hero-content');
      if (content) {
        content.style.transform = 'translate(' + (x * 5) + 'px, ' + (y * 5) + 'px)';
        content.style.transition = 'transform 0.2s ease-out';
      }
    });

    // Form submit — Register user on backend then Auto-Login
    document.getElementById('register-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value;
      const btn = document.getElementById('btn-start');
      const notification = document.getElementById('auth-notification');

      if (!username || !password) return;

      btn.disabled = true;
      btn.textContent = 'Creating Account...';
      notification.style.display = 'none';

      try {
        // 1. Register User
        const regResponse = await fetch(`${API_URL}/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const regData = await regResponse.json();

        if (!regResponse.ok) {
          throw new Error(regData.error || 'Registration failed');
        }

        // 2. Auto Login
        btn.textContent = 'Logging in...';
        const loginResponse = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const loginData = await loginResponse.json();

        if (!loginResponse.ok) {
          throw new Error(loginData.error || 'Auto-login failed');
        }

        // Save session details
        localStorage.setItem('wb_token', loginData.token);
        localStorage.setItem('wb_player', loginData.username);
        localStorage.setItem('wb_best', loginData.highscore || 0);
        localStorage.setItem('wb_registered', 'true');

        // Success notification
        notification.textContent = 'Account created! Welcome to the Arena.';
        notification.style.backgroundColor = 'rgba(76, 175, 80, 0.2)';
        notification.style.color = '#4CAF50';
        notification.style.border = '1px solid rgba(76, 175, 80, 0.4)';
        notification.style.display = 'block';

        // Animate out then navigate
        setTimeout(() => {
          document.querySelector('.register-form-wrap').style.opacity = '0';
          document.querySelector('.register-form-wrap').style.transform = 'translateY(-10px)';
          document.querySelector('.register-form-wrap').style.transition = 'all 0.3s ease';
          setTimeout(function () {
            window.location.href = 'menu.html';
          }, 300);
        }, 1000);

      } catch (err) {
        notification.textContent = err.message;
        notification.style.backgroundColor = 'rgba(244, 67, 54, 0.2)';
        notification.style.color = '#F44336';
        notification.style.border = '1px solid rgba(244, 67, 54, 0.4)';
        notification.style.display = 'block';
        
        btn.disabled = false;
        btn.textContent = 'Start Blasting';
      }
    });

    // If already registered and has token, redirect to menu
    if (localStorage.getItem('wb_registered') === 'true' && localStorage.getItem('wb_token')) {
      window.location.href = 'menu.html';
    }
  </script>
</body>
</html>
